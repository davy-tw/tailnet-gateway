apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet-gateway
  namespace: tailnet-gateway-system
  labels:
    app.kubernetes.io/name: tailnet-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-gateway
    spec:
      serviceAccountName: tailnet-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: tailnet-gateway
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # TAILSCALE_OAUTH_CLIENT_ID, TAILSCALE_OAUTH_CLIENT_SECRET and any
          # other settings (see README) come from this optional Secret.
          envFrom:
            - secretRef:
                name: tailnet-gateway
                optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
