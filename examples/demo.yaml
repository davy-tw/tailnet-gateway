# Smoke test: one Gateway, one HTTPRoute splitting /api and / across two
# backends. Reachable at http://demo.<tailnet>.ts.net once the Tailscale
# Service svc:demo is defined and the proxies are approved (docs/setup.md).
apiVersion: v1
kind: Namespace
metadata:
  name: tailnet-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tailnet-demo
spec:
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080", "--name=api"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tailnet-demo
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tailnet-demo
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080", "--name=web"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tailnet-demo
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: tailnet-demo
spec:
  gatewayClassName: tailnet
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: tailnet-demo
spec:
  parentRefs:
    - name: demo
  hostnames: ["demo"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: api
          port: 8080
    - backendRefs:
        - name: web
          port: 80
