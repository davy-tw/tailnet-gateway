# A shared Gateway that lets ListenerSets in its own namespace add
# listeners, and a ListenerSet that adds an HTTP listener on 8080. The
# route attaches to the ListenerSet, not the Gateway, and is served as
# svc:team-web on port 8080 by the Gateway's proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: tailnet-demo
spec:
  gatewayClassName: tailnet
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: team
  namespace: tailnet-demo
spec:
  parentRef:
    name: shared
  listeners:
    - name: web
      protocol: HTTP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-web
  namespace: tailnet-demo
spec:
  parentRefs:
    - kind: ListenerSet
      name: team
      sectionName: web
  hostnames: ["team-web"]
  rules:
    - backendRefs:
        - name: web
          port: 80
