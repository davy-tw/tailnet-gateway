apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: tailnet-demo
spec:
  ingressClassName: tailnet
  tls:
    - hosts: [site]   # any tls entry switches the listener to HTTPS on 443
  rules:
    - host: site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
