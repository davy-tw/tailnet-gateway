name: release
# Publishes the controller image and Helm chart to GHCR.
#
# - Every push to main: image tags `main` and `sha-<short sha>`.
# - Every `v*` tag (for example v0.1.0): image tags `0.1.0`, `0.1` and
#   `latest`; the chart as oci://ghcr.io/<owner>/charts/tailnet-gateway
#   version 0.1.0; and a GitHub release with an install.yaml pinned to that
#   image.
# - Optionally, a release is then deployed to a cluster (see the deploy job).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to deploy (for example 0.1.0)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tailnet-gateway/controller
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/tailnet-gateway --version "$VERSION" --app-version "$VERSION" -d bin
          helm push "bin/tailnet-gateway-$VERSION.tgz" "$CHART_REPO"
      - name: install bundle pinned to the release image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s|image: ${IMAGE}:latest|image: ${IMAGE}:${VERSION}|" dist/install.yaml > bin/install.yaml
          grep -q "image: ${IMAGE}:${VERSION}" bin/install.yaml
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            "bin/install.yaml" "bin/tailnet-gateway-$VERSION.tgz"

  # Deploys a released chart with `helm upgrade --install`. It runs only when
  # the repository variable DEPLOY_ENABLED is "true", in the `production`
  # environment, which must hold a KUBECONFIG secret (the kubeconfig file
  # contents). The OAuth credentials are expected in the Secret named by the
  # environment variable OAUTH_SECRET (default `tailnet-gateway`), created in
  # the target namespace beforehand, so they never pass through Helm values.
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      !failure() && !cancelled()
    needs: [chart]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_DATA" || { echo "the production environment has no KUBECONFIG secret"; exit 1; }
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: helm upgrade --install
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          NAMESPACE: ${{ vars.DEPLOY_NAMESPACE || 'tailnet-gateway-system' }}
          OAUTH_SECRET: ${{ vars.OAUTH_SECRET || 'tailnet-gateway' }}
          VALUES: ${{ vars.HELM_VALUES }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          args=()
          if [ -n "$VALUES" ]; then printf '%s\n' "$VALUES" > "$RUNNER_TEMP/values.yaml"; args+=(-f "$RUNNER_TEMP/values.yaml"); fi
          helm upgrade --install tailnet-gateway "$CHART_REPO/tailnet-gateway" \
            --version "${VERSION#v}" --namespace "$NAMESPACE" --create-namespace \
            --set oauth.existingSecret="$OAUTH_SECRET" "${args[@]}" \
            --wait --timeout 5m
