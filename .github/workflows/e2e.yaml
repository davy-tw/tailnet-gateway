name: e2e
# Runs test/e2e on kind (upstream Kubernetes) and on k3s through k3d, with
# the controller installed from the chart and no tailnet (see
# `make e2e-kind` and `make e2e-k3d`). Runs on pull requests, and from the
# release workflow before anything is published (pushes to main and tags).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # github.workflow is the caller's name when called from release, so a
  # release run never cancels (or waits for) a pull request run.
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    name: e2e (${{ matrix.provider }}, Gateway API ${{ matrix.gateway-api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, k3d]
        # The oldest supported release and the newest.
        gateway-api: [v1.6.3, v1.7.0]
    env:
      KIND_VERSION: v0.30.0
      K3D_VERSION: v5.9.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: install kind
        if: matrix.provider == 'kind'
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind version
      - name: install k3d
        if: matrix.provider == 'k3d'
        run: |
          curl -fsSLo ./k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-$(go env GOARCH)"
          chmod +x ./k3d && sudo mv ./k3d /usr/local/bin/k3d
          k3d version
      - name: e2e
        run: make "e2e-${{ matrix.provider }}" GATEWAY_API_VERSION="${{ matrix.gateway-api }}"
