name: ci
# Runs on pull requests, and from the release workflow before anything is
# published (pushes to main and tags).
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: make vet
      - name: install bundle is up to date
        run: make manifests && git diff --exit-code dist/
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: helm lint
        run: make chart-lint
      - name: render chart
        run: make chart-render
      - name: tests (unit + envtest)
        run: make test-envtest
        env:
          CHART_MANIFESTS: ${{ github.workspace }}/bin/chart.yaml
      - name: build image
        run: docker build .
