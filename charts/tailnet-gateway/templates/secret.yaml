{{- if and (not .Values.oauth.existingSecret) (or .Values.oauth.clientId .Values.oauth.clientSecret) }}
{{- if not (and .Values.oauth.clientId .Values.oauth.clientSecret) }}
{{- fail "oauth.clientId and oauth.clientSecret must be set together" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tailnet-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  TAILSCALE_OAUTH_CLIENT_ID: {{ .Values.oauth.clientId | quote }}
  TAILSCALE_OAUTH_CLIENT_SECRET: {{ .Values.oauth.clientSecret | quote }}
{{- end }}
