{{- $env := dict
  "GATEWAY_CONTROLLER_NAME" .Values.controller.name
  "DEFAULT_GATEWAY_CLASS" .Values.controller.defaultGatewayClass
  "INGRESS_CLASS" .Values.controller.ingressClass
  "LOAD_BALANCER_CLASS" .Values.controller.loadBalancerClass
  "AUTH_KEY_DESCRIPTION" .Values.controller.authKeyDescription
  "TAILNET_DOMAIN" .Values.controller.tailnetDomain
  "CLUSTER_DOMAIN" .Values.controller.clusterDomain
  "TAILSCALE_API_URL" .Values.controller.tailscaleApiUrl
  "PROXY_TAGS" .Values.proxy.tags
  "PROXY_REPLICAS" (toString .Values.proxy.replicas)
  "PROXY_IMAGE" .Values.proxy.image
  "PROXY_DRAIN_GRACE_PERIOD" .Values.proxy.drainGracePeriod
  "PROXY_CERTIFICATE_SHARING" (toString .Values.proxy.certificateSharing)
  "PROXY_CERTIFICATE_RELOAD" .Values.proxy.certificateReload
-}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailnet-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailnet-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tailnet-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailnet-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart when chart-managed credentials change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tailnet-gateway.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $k, $v := $env }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "tailnet-gateway.secretName" . }}
                optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
