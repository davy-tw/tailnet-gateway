apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: tailnet-gateway
    pod-security.kubernetes.io/enforce: restricted
  name: tailnet-gateway-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailnet-gateway
  namespace: tailnet-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailnet-gateway-leader-election
  namespace: tailnet-gateway-system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailnet-gateway
rules:
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gateways
  - httproutes
  - grpcroutes
  - tlsroutes
  - tcproutes
  - udproutes
  - referencegrants
  - backendtlspolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses/status
  - gateways/status
  - httproutes/status
  - grpcroutes/status
  - tlsroutes/status
  - tcproutes/status
  - udproutes/status
  - backendtlspolicies/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - services/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailnet-gateway-leader-election
  namespace: tailnet-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailnet-gateway-leader-election
subjects:
- kind: ServiceAccount
  name: tailnet-gateway
  namespace: tailnet-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailnet-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailnet-gateway
subjects:
- kind: ServiceAccount
  name: tailnet-gateway
  namespace: tailnet-gateway-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: tailnet-gateway
  name: tailnet-gateway-metrics
  namespace: tailnet-gateway-system
spec:
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: tailnet-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tailnet-gateway
  name: tailnet-gateway
  namespace: tailnet-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-gateway
    spec:
      containers:
      - env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - secretRef:
            name: tailnet-gateway
            optional: true
        image: ghcr.io/davy-tw/tailnet-gateway:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
        name: manager
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: tailnet-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: tailnet
spec:
  controllerName: tailnet-gateway.davy-tw.github.io/gateway-controller
  description: Exposes Gateways to the tailnet as Tailscale Services.
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: tailnet
spec:
  controller: tailnet-gateway.davy-tw.github.io/ingress-controller
